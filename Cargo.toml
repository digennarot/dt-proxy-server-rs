[package]
name = "dt-proxy-server"
version = "0.1.1"
edition = "2021"
description = "DeepL proxy for the Foundry VTT Deep Translate module (Rust port of dt-proxy-server)"
license = "MIT"
authors = ["digennarot <tiziano.digennaro@gmail.com>"]
repository = "https://github.com/digennarot/dt-proxy-server-rs"
homepage = "https://github.com/digennarot/dt-proxy-server-rs"
readme = "README.md"
keywords = ["deepl", "proxy", "foundry-vtt", "translation"]
categories = ["web-programming::http-server"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "server", "http1"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
subtle = "2.6.1"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

# ---------------------------------------------------------------------------
# Debian package: `cargo install cargo-deb --locked && cargo deb`
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "dt-proxy-server"
maintainer = "digennarot <tiziano.digennaro@gmail.com>"
copyright = "2026, YanK (original Node.js dt-proxy-server); digennarot (Rust port)"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto, adduser, ca-certificates"
extended-description = """\
Self-hosted proxy between the Deep Translate module of Foundry VTT and the \
DeepL API. The DeepL key stays on the server; Foundry only holds a revocable \
proxy token. Runs as a hardened systemd service (dt-proxy-server.service)."""
assets = [
    ["target/release/dt-proxy-server", "usr/bin/", "755"],
    ["debian/config.json", "etc/dt-proxy-server/config.json", "600"],
    ["debian/dt-proxy-server.env", "etc/dt-proxy-server/dt-proxy-server.env", "600"],
    ["README.md", "usr/share/doc/dt-proxy-server/README.md", "644"],
]
conf-files = [
    "/etc/dt-proxy-server/config.json",
    "/etc/dt-proxy-server/dt-proxy-server.env",
]
maintainer-scripts = "debian/"
systemd-units = { unit-scripts = "debian", unit-name = "dt-proxy-server", enable = true, start = true, restart-after-upgrade = true }
