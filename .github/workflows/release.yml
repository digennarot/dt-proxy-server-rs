name: Release

# Runs when a version tag such as v1.2.3 (or v1.2.3-rc.1) is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.deb_arch }} package
    strategy:
      fail-fast: true
      matrix:
        include:
          # Oldest LTS runners: the binaries then run on Debian 12 / Ubuntu 22.04 and newer.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            deb_arch: amd64
          # Native arm64 runner (free for public repositories). Building natively avoids a
          # cross toolchain and lets the test suite run on the real architecture.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Tag must match the version in Cargo.toml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run the test suite
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build the .deb package
        run: |
          mkdir -p dist
          cargo deb --no-build --target ${{ matrix.target }} --output dist/

      - name: Verify Debian package
        run: |
          packages=(dist/*_${{ matrix.deb_arch }}.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one ${{ matrix.deb_arch }} Debian package, found ${#packages[@]}"
            exit 1
          fi
          ls -l dist
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: debian-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Publish Debian packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=""
            case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "dt-proxy-server $GITHUB_REF_NAME" \
              --generate-notes --verify-tag $flags
          fi
